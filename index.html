<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 暗號轉換助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #18181b; color: #f4f4f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* 密碼彈窗 */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 999; }
    .modal { background: #27272a; padding: 2rem; border-radius: 16px; border: 1px solid #3f3f46; text-align: center; max-width: 360px; width: 90%; }
    .modal input { width: 100%; padding: 12px; margin: 16px 0; border-radius: 8px; border: 1px solid #52525b; background: #18181b; color: #fff; text-align: center; font-size: 1.1rem; }
    .modal button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #6366f1; color: #fff; font-weight: bold; cursor: pointer; }

    /* 聊天室主體 */
    header { background: #27272a; padding: 16px; text-align: center; font-weight: bold; border-bottom: 1px solid #3f3f46; display: flex; justify-content: space-between; align-items: center; }
    .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; position: relative; group; }
    .message.user { background: #6366f1; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message.ai { background: #27272a; color: #f4f4f5; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #3f3f46; }

    /* 訊息操作按鈕 */
    .actions { display: flex; gap: 8px; margin-top: 8px; font-size: 0.75rem; opacity: 0.8; }
    .btn-action { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .btn-action:hover { background: rgba(255,255,255,0.2); }

    /* 輸入區塊 */
    .input-area { background: #27272a; padding: 16px; border-top: 1px solid #3f3f46; display: flex; flex-direction: column; gap: 10px; }
    .input-row { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #3f3f46; background: #18181b; color: #fff; }
    .btn-send { padding: 12px 20px; border-radius: 8px; border: none; background: #6366f1; color: #fff; font-weight: bold; cursor: pointer; }

    /* 平板/手機 虛擬鍵盤 */
    .virtual-keyboard { display: none; grid-template-columns: repeat(10, 1fr); gap: 4px; background: #18181b; padding: 10px; border-radius: 8px; margin-top: 6px; }
    .key-btn { background: #3f3f46; color: #fff; border: none; padding: 8px 0; border-radius: 4px; font-size: 0.85rem; cursor: pointer; text-align: center; }
    .key-btn:active { background: #6366f1; }
    .kb-toggle { font-size: 0.8rem; color: #a1a1aa; cursor: pointer; text-align: right; }

    @media (max-width: 768px) {
      .virtual-keyboard.active { display: grid; }
    }
  </style>
</head>
<body>

  <!-- 密碼驗證模態框 -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <h3>🔒 身份驗證</h3>
      <p style="font-size:0.8rem; color:#a1a1aa; margin-top:6px;">請輸入 generator.html 產生的密碼</p>
      <input type="password" id="passInput" placeholder="輸入 8 位密碼" />
      <button onclick="verifyPassword()">解鎖登入</button>
      <p id="errorMsg" style="color:#ef4444; font-size:0.8rem; margin-top:10px; display:none;">密碼錯誤或已過期</p>
    </div>
  </div>

  <header>
    <span>🤖 AI 注音暗號對話助手</span>
    <span id="sessionTimer" style="font-size: 0.8rem; color: #10b981;">已驗證</span>
  </header>

  <div class="chat-container" id="chatBox">
    <div class="message ai">
      你好！我是你的暗號助手。請直接輸入中文注音暗號（使用實體鍵盤對應鍵）或數字密碼，我會自動幫你翻譯！
    </div>
  </div>

  <div class="input-area">
    <div class="kb-toggle" onclick="toggleKeyboard()">📱 開啟/關閉 手機注音鍵盤</div>
    
    <!-- 手機虛擬注音鍵盤 -->
    <div class="virtual-keyboard" id="vKeypad"></div>

    <div class="input-row">
      <input type="text" id="userInput" placeholder="輸入訊息...（電腦自動轉對應注音鍵）" autocomplete="off" />
      <button class="btn-send" onclick="sendMessage()">發送</button>
    </div>
  </div>

  <script>
    // --- 1. 核心編解碼對照表 (繼承 Scratch 邏輯) ---
    const bopomofoList = ["ㄅ", "ㄆ", "ㄇ", "ㄈ", "ㄉ", "ㄊ", "ㄋ", "ㄌ", "ㄍ", "ㄎ", "ㄏ", "ㄐ", "ㄑ", "ㄒ", "ㄓ", "ㄔ", "ㄕ", "ㄖ", "ㄗ", "ㄘ", "ㄙ"];
    const listA = ["ㄧ", "ㄨ", "ㄩ"];
    const listB = ["ㄚ", "ㄛ", "ㄜ", "ㄝ", "ㄞ", "ㄟ", "ㄠ", "ㄡ", "ㄢ", "ㄣ", "ㄤ", "ㄥ", "ㄦ"];
    const listC = ["˙", "ˉ", "ˊ", "ˇ", "ˋ"];

    // 鍵盤物理按鍵映射對照 (Standard Taiwan Layout)
    const keyMap = {
      '1':'ㄅ', 'q':'ㄆ', 'a':'ㄇ', 'z':'ㄈ', '2':'ㄉ', 'w':'ㄊ', 's':'ㄋ', 'x':'ㄌ',
      '3':'ˇ', 'e':'ㄍ', 'd':'ㄎ', 'c':'ㄏ', '4':'ˋ', 'r':'ㄐ', 'f':'ㄑ', 'v':'ㄒ',
      '5':'ㄓ', 't':'ㄔ', 'g':'ㄕ', 'b':'ㄖ', '6':'ˊ', 'y':'ㄗ', 'h':'ㄘ', 'n':'ㄙ',
      '7':'˙', 'u':'ㄧ', 'j':'ㄨ', 'm':'ㄩ', '8':'ㄚ', 'i':'ㄛ', 'k':'ㄜ', ',':'ㄝ',
      '9':'ㄞ', 'o':'ㄟ', 'l':'ㄠ', '.':'ㄡ', '0':'ㄢ', 'p':'ㄣ', ';':'ㄤ', '/':'ㄥ',
      '-':'ㄦ', ' ':'ˉ'
    };

    // --- 2. 密碼驗證與 15 分鐘計時器 ---
    async function getCurrentPassword() {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const gmt8 = new Date(utc + (3600000 * 8));

      const yyyy = gmt8.getFullYear();
      const mm = String(gmt8.getMonth() + 1).padStart(2, '0');
      const dd = String(gmt8.getDate()).padStart(2, '0');
      const hh = String(gmt8.getHours()).padStart(2, '0');
      const minBlock = String(Math.floor(gmt8.getMinutes() / 10) * 10).padStart(2, '0');

      const rawString = `${yyyy}${mm}${dd}${hh}${minBlock}00`;
      const encoder = new TextEncoder();
      const data = encoder.encode(rawString + "BOPOMOFO_SALT_2026");
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 8).toUpperCase();
    }

    async function verifyPassword() {
      const input = document.getElementById('passInput').value.trim().toUpperCase();
      const correctPass = await getCurrentPassword();

      if (input === correctPass) {
        document.getElementById('authModal').style.display = 'none';
        const expireTime = Date.now() + (15 * 60 * 1000); // 15 分鐘
        localStorage.setItem('sessionExpire', expireTime);
        startSessionTimer();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    function checkSession() {
      const expireTime = localStorage.getItem('sessionExpire');
      if (!expireTime || Date.now() > parseInt(expireTime)) {
        document.getElementById('authModal').style.display = 'flex';
        localStorage.removeItem('sessionExpire');
      } else {
        document.getElementById('authModal').style.display = 'none';
        startSessionTimer();
      }
    }

    function startSessionTimer() {
      setInterval(() => {
        const expireTime = localStorage.getItem('sessionExpire');
        if (!expireTime || Date.now() > parseInt(expireTime)) {
          checkSession();
        } else {
          const remainingSec = Math.floor((parseInt(expireTime) - Date.now()) / 1000);
          const min = Math.floor(remainingSec / 60);
          const sec = remainingSec % 60;
          document.getElementById('sessionTimer').innerText = `可用時間：${min}分${sec}秒`;
        }
      }, 1000);
    }

    // --- 3. 電腦輸入自動選取鍵盤對應字（非中文輸入法） ---
    const inputEl = document.getElementById('userInput');
    inputEl.addEventListener('keydown', (e) => {
      // 忽略 Control, Alt, Enter 等功能鍵
      if (e.ctrlKey || e.altKey || e.key === 'Enter' || e.key === 'Backspace') return;
      
      const char = e.key.toLowerCase();
      if (keyMap[char]) {
        e.preventDefault(); // 阻擋原本英文字母輸入
        inputEl.value += keyMap[char]; // 自動填入對應注音符號
      }
    });

    // --- 4. 編解碼演算法處理 ---
    function processCodec(text) {
      // 判斷是「數字暗號」還是「注音」
      if (/^[0-9\s]+$/.test(text)) {
        return "【解碼結果】" + text; // 可擴充解碼邏輯
      } else {
        let codeResult = "";
        for (let char of text) {
          if (bopomofoList.includes(char)) {
            let idx = bopomofoList.indexOf(char) + 1;
            codeResult += idx < 10 ? "0" + idx : idx;
          } else if (listA.includes(char)) {
            codeResult += (listA.indexOf(char) + 1);
          } else if (listB.includes(char)) {
            let idx = listB.indexOf(char) + 1;
            codeResult += idx < 10 ? "0" + idx : idx;
          } else if (listC.includes(char)) {
            codeResult += listC.indexOf(char);
          } else {
            codeResult += char;
          }
        }
        return "【暗號生成】" + codeResult;
      }
    }

    // --- 5. 聊天室互動功能 ---
    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      inputEl.value = '';

      // AI 運算回覆
      setTimeout(() => {
        const reply = processCodec(text);
        appendMessage(reply, 'ai');
      }, 300);
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      
      const content = document.createElement('div');
      content.innerText = text;
      msgDiv.appendChild(content);

      // 操作按鈕 (複製/編輯)
      const actions = document.createElement('div');
      actions.className = 'actions';
      actions.innerHTML = `
        <button class="btn-action" onclick="copyText('${text}')">📋 複製</button>
        ${sender === 'user' ? `<button class="btn-action" onclick="editMessage(this, '${text}')">✏️ 編輯</button>` : ''}
      `;
      msgDiv.appendChild(actions);

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      alert('已複製到剪貼簿！');
    }

    function editMessage(btn, oldText) {
      inputEl.value = oldText;
      inputEl.focus();
    }

    // --- 6. 移動端虛擬鍵盤建置 ---
    function initVirtualKeyboard() {
      const keypad = document.getElementById('vKeypad');
      const keys = [...bopomofoList, ...listA, ...listB, ...listC];
      keys.forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.innerText = k;
        btn.onclick = () => { inputEl.value += k; };
        keypad.appendChild(btn);
      });
    }

    function toggleKeyboard() {
      document.getElementById('vKeypad').classList.toggle('active');
    }

    // 初始化
    initVirtualKeyboard();
    checkSession();
  </script>
</body>
</html>
